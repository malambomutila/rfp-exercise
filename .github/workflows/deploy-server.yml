name: Deploy site to server

# What this workflow does, in one line: it builds the static RFP report and
# rsyncs it to the user's own server, which serves it at
# https://rfp.malambomutila.com behind the existing nginx reverse proxy.
#
# This is deliberately separate from the "Daily RFP report" workflow, which
# publishes the same build to GitHub Pages. The two delivery paths are
# independent on purpose: if one breaks, the other keeps serving.

on:
  # 1. On every push to main that could change the output. Documentation-only
  #    commits do not need a redeploy, hence the path filter.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'deploy/**'
      - '.github/workflows/deploy-server.yml'

  # 2. Manual trigger, for the first run after the secret is set and for
  #    re-deploying on demand.
  workflow_dispatch:

  # 3. After the daily report workflow finishes, so the server picks up each
  #    scheduled build without duplicating the cron schedule here. Keeping the
  #    schedule in one place means the two delivery paths cannot drift apart.
  #    The name below must match the "name:" field of daily-report.yml exactly.
  workflow_run:
    workflows: ["Daily RFP report"]
    types: [completed]

# Read-only token. This workflow only needs to check the repository out; it
# commits nothing and publishes nothing to GitHub Pages.
permissions:
  contents: read

# Never let two deployments write to the server at the same time. An overlap
# could interleave rsync writes and leave a half-updated site on disk.
# cancel-in-progress is false so that a deployment already in flight finishes
# cleanly rather than leaving partial content behind.
concurrency:
  group: rfp-deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to rfp.malambomutila.com
    runs-on: ubuntu-latest

    # Guard for trigger 3: a workflow_run event fires on failure and on
    # cancellation too, and we must not deploy the output of a failed build.
    # Pushes and manual runs have no workflow_run payload, so the second
    # condition lets them through.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # ── Source ───────────────────────────────────────────────────────────
      - name: Check out the repository
        uses: actions/checkout@v4

      # ── Build ────────────────────────────────────────────────────────────
      # Python 3.12 matches the version on the server, so behaviour is the same
      # in both places. There is no pip install step: the pipeline is standard
      # library only by design, which also means nothing to cache.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the static site
        run: python3 src/main.py --days 7 --out site
        env:
          # Without this the model refinement layer silently skips and the
          # server publishes rules-only scores, which is what happened until
          # this was added: Pages and the server disagreed on every ranking.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # Safety gate. rsync runs with --delete, so deploying an empty or broken
      # build would wipe the live site. If the build did not produce an
      # index.html we stop here and the server keeps serving the previous copy.
      - name: Verify the build produced a site
        run: |
          set -euo pipefail
          test -s site/index.html || { echo "site/index.html missing or empty, refusing to deploy"; exit 1; }
          echo "Files to deploy:"
          ls -la site/

      # ── SSH setup ────────────────────────────────────────────────────────
      # The private key is a dedicated deployment keypair generated on the
      # server for this repository only. It is not the user's personal key, and
      # it is restricted in the server's authorized_keys (no port forwarding,
      # no agent forwarding, no PTY).
      #
      # Host verification is done properly: the server's real public host key is
      # pinned in known_hosts below. StrictHostKeyChecking is never disabled,
      # so a man-in-the-middle cannot silently intercept the deployment.
      - name: Configure SSH client
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write the key via the environment rather than inline, so it is
          # never expanded into the shell trace or the run log.
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/rfp_deploy
          chmod 600 ~/.ssh/rfp_deploy
          # Pinned host key for 198.54.121.71, recorded with ssh-keyscan at
          # setup time. A host public key is not a secret, so committing it is
          # safe. If the server is ever rebuilt, this line must be refreshed
          # with: ssh-keyscan -t ed25519 198.54.121.71
          # Written with printf rather than a heredoc, because an unindented
          # heredoc body would terminate the YAML block scalar.
          printf '%s\n' \
            '198.54.121.71 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGG7R96j083fRPAXycgHxow7DcF+ArytiraDaRM82e5S' \
            > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # ── Deploy ───────────────────────────────────────────────────────────
      # --delete removes files on the server that no longer exist in the build,
      # so stale pages do not linger. The safety gate above makes that safe.
      # The trailing slash on "site/" copies the contents, not the directory.
      # IdentitiesOnly=yes stops ssh offering any other key it may find.
      - name: Deploy site to the server over rsync
        run: |
          set -euo pipefail
          rsync -rlptvz --delete \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i ~/.ssh/rfp_deploy" \
            site/ mm@198.54.121.71:/home/mm/apps/rfp/site/

      # ── Verify ───────────────────────────────────────────────────────────
      # Fetch the live URL over HTTPS with certificate verification on. This
      # catches a broken proxy, a stopped container or an expired certificate
      # straight away, rather than leaving a silently broken public site.
      - name: Verify the live site responds
        run: |
          set -euo pipefail
          # The report sits behind a login gate, so an unauthenticated request
          # to the root must redirect rather than return the page. Asserting
          # 302 here also catches the gate failing open, which would silently
          # publish the report to the public web.
          root=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://rfp.malambomutila.com/)
          echo "unauthenticated root returned HTTP $root (expecting 302)"
          test "$root" = "302"

          # The login form must be reachable, or nobody can get in.
          form=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://rfp.malambomutila.com/login)
          echo "login form returned HTTP $form (expecting 200)"
          test "$form" = "200"

      # Always remove the key material from the runner, even if a step above
      # failed. Runners are ephemeral, but do not rely on that.
      - name: Remove the deployment key from the runner
        if: always()
        run: rm -f ~/.ssh/rfp_deploy
