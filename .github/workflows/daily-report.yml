name: Daily RFP report

# What this workflow does, in one line: it builds the daily RFP digest, deploys
# it to the server behind rfp.malambomutila.com, and keeps a dated copy in
# reports/ so the history survives.
#
# This used to be two workflows publishing to two places, GitHub Pages and the
# server. Pages was only ever a fast way to get a link up before the server was
# ready, and keeping it cost more than it was worth: each workflow ran the
# pipeline separately, so the two URLs served different data from runs minutes
# apart. One build, one destination, no divergence.

on:
  schedule:
    # 05:30 UTC daily, which is 07:30 in Lusaka (UTC+2) and 08:30 in Nairobi
    # (UTC+3). Both are before the start of the working day, so the report is
    # already waiting when the fundraising director sits down. GitHub cron is
    # always UTC and has no timezone field, so the offset is baked into the
    # expression below.
    - cron: '30 5 * * *'
  # Manual trigger, used for the first run after setup and for re-running the
  # report on demand without waiting for the next cron tick.
  workflow_dispatch:
  # Rebuild and redeploy when the pipeline itself changes. Documentation-only
  # commits are excluded, since they cannot change the output.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/daily-report.yml'

# Least privilege. Only one permission is needed now that Pages is gone:
#   contents: write  commits the dated archive copy back to main
permissions:
  contents: write

# Two runs must never overlap. An overlap would race on the push to main and
# could deploy an older report over a newer one. cancel-in-progress is false on
# purpose: a run that is already committing should be allowed to finish.
concurrency:
  group: rfp-daily-report
  cancel-in-progress: false

jobs:
  report:
    name: Build, archive and deploy the report
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # DELIBERATE CHOICE: there is no pip install step. The tool is Python
      # standard library only, so there is nothing to install. This keeps the
      # run fast, removes dependency resolution as a failure mode, and means a
      # reviewer can clone the repo and run python src/main.py with no setup.
      - name: Build the report
        env:
          # Optional. The scorer uses this to refine the top results and write
          # their rationales when the secret exists. The job is NOT gated on
          # it: when the secret is absent this resolves to an empty string and
          # the tool falls back to deterministic keyword scoring, so the
          # workflow still succeeds and still publishes a report.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python src/main.py

      - name: Locate the generated site
        id: resolve_site
        run: |
          # ASSUMPTION: src/main.py writes the rendered report to site/index.html.
          # The fallbacks cover the other output directory names in common use so
          # a small change on the rendering side does not silently break the
          # deploy. If none of them holds an index.html the build fails loudly
          # here rather than deploying an empty directory.
          for candidate in site _site public; do
            if [ -f "$candidate/index.html" ]; then
              echo "site_dir=$candidate" >> "$GITHUB_OUTPUT"
              echo "Found the generated report at $candidate/index.html"
              exit 0
            fi
          done
          echo "No index.html found in site/, _site/ or public/." >&2
          echo "src/main.py must write the rendered report to site/index.html." >&2
          exit 1

      # Safety gate before anything is copied to the server. rsync runs with
      # --delete, so deploying an empty or broken build would wipe the live
      # site. If the build did not produce a usable index.html we stop here and
      # the server keeps serving the previous copy.
      - name: Verify the build produced a site
        run: |
          set -euo pipefail
          site_dir='${{ steps.resolve_site.outputs.site_dir }}'
          test -s "$site_dir/index.html" || {
            echo "index.html missing or empty, refusing to deploy" >&2
            exit 1
          }
          echo "Files to deploy:"
          ls -la "$site_dir/"

      - name: Archive the dated report on main
        run: |
          # The workflow keeps its own durable archive so the daily history is
          # visible in the repository. The live URL only ever shows today.
          report_date="$(date -u +%F)"
          mkdir -p reports
          cp "${{ steps.resolve_site.outputs.site_dir }}/index.html" "reports/${report_date}.html"

          # NOTE: this is the workflow committing its own generated output. It is
          # deliberately attributed to the github-actions bot so that these
          # machine commits are easy to tell apart from the human authored
          # commits in this repository.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Only reports/ is staged. Nothing else the run touched, for example a
          # local scratch directory or a cached API response, can reach the
          # public repository through this step.
          git add reports/

          # Guard: on a day when the report is byte identical to an existing
          # archived copy there is nothing to commit, and git commit would exit
          # non zero and fail the run.
          if git diff --cached --quiet; then
            echo "Archive unchanged for ${report_date}, nothing to commit."
          else
            git commit -m "Daily RFP report for ${report_date}"
            git push
          fi

      - name: Configure SSH client
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write the key via the environment rather than inline, so it is
          # never expanded into the shell trace or the run log.
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/rfp_deploy
          chmod 600 ~/.ssh/rfp_deploy
          # Pinned host key for 198.54.121.71, recorded with ssh-keyscan at
          # setup time. A host public key is not a secret, so committing it is
          # safe. If the server is ever rebuilt, this line must be refreshed
          # with: ssh-keyscan -t ed25519 198.54.121.71
          # Written with printf rather than a heredoc, because an unindented
          # heredoc body would terminate the YAML block scalar.
          printf '%s\n' \
            '198.54.121.71 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGG7R96j083fRPAXycgHxow7DcF+ArytiraDaRM82e5S' \
            > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # --delete removes files on the server that no longer exist in the build,
      # so stale pages do not linger. The safety gate above makes that safe.
      # The trailing slash on the source copies the contents, not the directory.
      # IdentitiesOnly=yes stops ssh offering any other key it may find.
      - name: Deploy the report to the server over rsync
        run: |
          set -euo pipefail
          rsync -rlptvz --delete \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i ~/.ssh/rfp_deploy" \
            '${{ steps.resolve_site.outputs.site_dir }}/' \
            mm@198.54.121.71:/home/mm/apps/rfp/site/

      # Fetch the live URL over HTTPS with certificate verification on. This
      # catches a broken proxy, a stopped container or an expired certificate
      # straight away, rather than leaving a silently broken public site.
      - name: Verify the live site responds
        run: |
          set -euo pipefail
          # The report sits behind a login gate, so an unauthenticated request
          # to the root must redirect rather than return the page. Asserting
          # 302 here also catches the gate failing open, which would silently
          # publish the report to the public web.
          root=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://rfp.malambomutila.com/)
          echo "unauthenticated root returned HTTP $root (expecting 302)"
          test "$root" = "302"

          # The login form must be reachable, or nobody can get in.
          form=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://rfp.malambomutila.com/login)
          echo "login form returned HTTP $form (expecting 200)"
          test "$form" = "200"

      # Always remove the key material from the runner, even if a step above
      # failed. Runners are ephemeral, but do not rely on that.
      - name: Remove the deployment key from the runner
        if: always()
        run: rm -f ~/.ssh/rfp_deploy
