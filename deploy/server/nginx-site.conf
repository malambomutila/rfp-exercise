# Inner nginx config for the rfp_site container.
#
# Static serving plus a login gate. TLS and public routing stay with the
# front-facing "nginx" container of the ohasp stack, which is untouched by
# this file.
#
# The gate works through auth_request: every request for site content triggers
# an internal subrequest to the rfp_auth container, which answers 204 when the
# session cookie is valid and 401 when it is not. A 401 redirects the visitor
# to the login form. nginx cannot validate a form POST by itself, which is why
# rfp_auth exists.

# Rate limit keyed on client address, applied only to the login endpoint, so a
# scripted password guesser is slowed down. 10r/m is generous for a human and
# hostile to a script. The zone is small because the visitor count is tiny.
limit_req_zone $binary_remote_addr zone=rfp_login:1m rate=10r/m;

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers. Without this nginx builds an absolute URL
    # from $scheme, which is http inside this container because TLS terminates
    # one hop upstream, so a redirect would bounce the visitor through plain
    # HTTP before coming back to HTTPS.
    absolute_redirect off;

    # Resolve rfp_auth at request time through Docker's embedded DNS, matching
    # the pattern the outer nginx uses. This means a recreated or briefly
    # stopped rfp_auth container does not stop this config from loading.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $auth_upstream "rfp_auth:8000";

    # Container health check target. Deliberately outside the gate so that
    # Docker can still tell whether the web server is alive when the auth
    # service is down, and cheap enough to run every 30 seconds.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The auth subrequest. "internal" means it cannot be requested directly
    # from outside. The request body is dropped because only the cookie
    # matters, which keeps the subrequest cheap.
    location = /_auth {
        internal;
        proxy_pass              http://$auth_upstream/auth;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header        X-Original-URI    $request_uri;
    }

    # The login form and its POST handler must stay outside the gate, or a
    # signed-out visitor could never reach the page that signs them in.
    location = /login {
        limit_req zone=rfp_login burst=5 nodelay;
        proxy_pass       http://$auth_upstream/login;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /logout {
        proxy_pass       http://$auth_upstream/logout;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # data.json is regenerated on every build, so it must never be cached by
    # intermediaries or the browser. It sits behind the gate like the page.
    location = /data.json {
        auth_request /_auth;
        error_page 401 = @to_login;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # index.html likewise: a reviewer should always see the latest report.
    location = /index.html {
        auth_request /_auth;
        error_page 401 = @to_login;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        auth_request /_auth;
        error_page 401 = @to_login;
        try_files $uri $uri/ =404;
    }

    # A browser following this lands on the form. Using 302 rather than 401
    # means the visitor sees a page instead of a bare error.
    location @to_login {
        return 302 /login;
    }
}
