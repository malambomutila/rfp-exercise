# Inner nginx config for the rfp_site container.
# Static serving only: no TLS here, no proxying. TLS and public routing are
# handled by the front-facing "nginx" container of the ohasp stack.
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Container health check target. Kept cheap and outside the site content
    # so it works even when the site directory is empty mid-deployment.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # data.json is regenerated on every build, so it must never be cached by
    # intermediaries or the browser.
    location = /data.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # index.html likewise: a reviewer should always see the latest report.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
